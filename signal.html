*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Manrope',system-ui,sans-serif;color:var(--ivory);min-height:100vh;
  background-color:#0C1830;
  background-image: linear-gradient(rgba(14,24,46,0.74), rgba(11,20,40,0.80)), var(--hero-image);
  background-size:cover;background-position:center;background-attachment:fixed;
}
a{text-decoration:none;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 20px 60px}

.topbar{display:flex;align-items:center;gap:14px;padding:18px 4px 8px}
.back{width:40px;height:40px;flex:none;border:0.5px solid var(--glass-line);border-radius:14px;
  background:var(--glass);display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:20px}
.back:hover{background:rgba(255,255,255,0.16)}
.title{font-family:'Marcellus',serif;font-size:26px;letter-spacing:.5px}
.spacer{flex:1}
.refresh{border:0.5px solid var(--glass-line);border-radius:14px;background:var(--glass);color:var(--ivory);
  padding:9px 14px;font-size:13px;font-family:inherit;cursor:pointer;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.refresh:hover{background:rgba(255,255,255,0.16)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 8px}
.stat{background:var(--glass);border:0.5px solid var(--glass-line);border-radius:16px;padding:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stat .lbl{font-size:12.5px;color:rgba(255,255,255,0.7)}
.stat .val{font-size:24px;font-weight:500;margin-top:5px;font-variant-numeric:tabular-nums}

.status-msg{text-align:center;padding:50px 20px;color:rgba(255,255,255,0.7);font-size:15px;line-height:1.6}

.cards{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.card{background:var(--glass);border:0.5px solid var(--glass-line);border-radius:18px;padding:18px 20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.18);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-head .left{display:flex;align-items:center;gap:10px}
.ticker{font-weight:500;font-size:16px}
.badge{font-size:12px;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,0.12);border:0.5px solid var(--glass-line)}
.tf{font-size:12px;color:rgba(255,255,255,0.65)}
.time{font-size:12px;color:rgba(255,255,255,0.5)}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.price .plbl{font-size:11.5px;color:rgba(255,255,255,0.65)}
.price .pval{font-size:18px;font-weight:500;margin-top:3px;font-variant-numeric:tabular-nums}
.pval.tp{color:#5fe0a8}.pval.sl{color:#f0a0a0}
.st{margin-top:12px;display:inline-block;font-size:12px;padding:3px 10px;border-radius:12px}
.st.open{background:rgba(90,150,255,0.18);color:#a9c9ff}
.st.tp{background:rgba(63,202,143,0.18);color:#7fe6b0}
.st.sl{background:rgba(226,75,74,0.18);color:#f0a0a0}

footer{text-align:center;padding:24px;font-size:12px;color:rgba(255,255,255,0.4)}
@media(max-width:560px){.stats{gap:8px}.stat .val{font-size:20px}.prices{gap:8px}.price .pval{font-size:16px}}
</style>
</head>

    <a class="back" href="index.html" aria-label="Orqaga">&larr;</a>
    <span class="title">Investing</span>
    <span class="spacer"></span>
    <button class="refresh" id="refresh">Yangilash</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="lbl">Ochiq savdolar</div><div class="val" id="stOpen">—</div></div>
    <div class="stat"><div class="lbl">Profit</div><div class="val" id="stWin">87%</div></div>
    <div class="stat"><div class="lbl">Jami signal</div><div class="val" id="stTotal">—</div></div>
  </div>

  <div id="content"><div class="status-msg" id="msg">Yuklanmoqda...</div></div>
</div>
<footer>Altin Turon &middot; Investing</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ====== SOZLAMA — Supabase kalitlarini shu yerga qo'ying ======
   Supabase → Settings → API bo'limidan oling:
   - Project URL
   - anon public key                                              */
const SUPABASE_URL  = "SIZNING_SUPABASE_URL";
const SUPABASE_ANON = "SIZNING_ANON_KEY";
/* ============================================================== */

const fmt = n => (n==null?"—":Number(n).toLocaleString("en-US",{maximumFractionDigits:2}));
function timeAgo(iso){
  if(!iso) return "";
  const d=(Date.now()-new Date(iso).getTime())/60000;
  if(d<1) return "hozir";
  if(d<60) return Math.round(d)+" daqiqa oldin";
  if(d<1440) return Math.round(d/60)+" soat oldin";
  return Math.round(d/1440)+" kun oldin";
}
const STLBL = {open:"ochiq", tp:"foyda oldi", sl:"stop (SL)", closed:"yopildi"};

function renderStats(rows){
  const open = rows.filter(r=>r.status==="open").length;
  document.getElementById("stOpen").textContent = open;
  document.getElementById("stTotal").textContent = rows.length;
  /* Profit (87%) hozircha o'zgarmas turadi */
}
function renderCards(rows){
  const c=document.getElementById("content");
  if(!rows.length){c.innerHTML='<div class="status-msg">Hozircha signal yo\'q.<br>Bot signal yuborganda shu yerda ko\'rinadi.</div>';return;}
  c.innerHTML='<div class="cards">'+rows.map(r=>{
    const stCls = r.status==="tp"?"tp":r.status==="sl"?"sl":"open";
    return `<div class="card">
      <div class="card-head">
        <div class="left"><span class="ticker">${r.ticker||""}</span>
          ${r.region?`<span class="badge">${r.region}</span>`:""}
          <span class="tf">${r.timeframe||""}</span></div>
        <span class="time">${timeAgo(r.signal_time||r.created_at)}</span>
      </div>
      <div class="prices">
        <div class="price"><div class="plbl">Eng yaxshi narx</div><div class="pval">${fmt(r.entry)}</div></div>
        <div class="price"><div class="plbl">Kutilayotgan foyda</div><div class="pval tp">${fmt(r.tp)}</div></div>
        <div class="price"><div class="plbl">SL</div><div class="pval sl">${fmt(r.sl)}</div></div>
      </div>
      <span class="st ${stCls}">${STLBL[r.status]||r.status||"ochiq"}</span>
    </div>`;
  }).join("")+'</div>';
}

async function load(){
  const msg=document.getElementById("msg");
  if(SUPABASE_URL.startsWith("SIZNING")||SUPABASE_ANON.startsWith("SIZNING")){
    document.getElementById("content").innerHTML='<div class="status-msg">Supabase hali ulanmagan.<br>signal.html ichida SUPABASE_URL va SUPABASE_ANON kalitlarini kiriting.</div>';
    return;
  }
  try{
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    const {data,error} = await sb.from("signals").select("*").order("created_at",{ascending:false}).limit(100);
    if(error) throw error;
    renderStats(data||[]);
    renderCards(data||[]);
  }catch(e){
    document.getElementById("content").innerHTML='<div class="status-msg">Xato: '+(e.message||e)+'<br>Supabase kalitlari va ruxsat (RLS) to\'g\'riligini tekshiring.</div>';
  }
}
document.getElementById("refresh").addEventListener("click",load);
load();
setInterval(load,60000);
</script>
</body>
</html>
