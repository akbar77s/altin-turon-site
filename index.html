*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Manrope',system-ui,sans-serif;color:var(--ivory);
  background-color:#0C1830;
  background-image: linear-gradient(rgba(14,24,46,0.62), rgba(11,20,40,0.68)), var(--hero-image);
  background-size:cover;background-position:center;background-attachment:fixed;
  min-height:100vh;
}
a{text-decoration:none;color:inherit}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 26px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-name{font-family:'Marcellus',serif;font-size:23px;letter-spacing:1px}
.top-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

.sessions{display:flex;gap:16px;font-size:12.5px;color:rgba(255,255,255,0.78)}
.sess{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#5f6b6b}
.dot.open{background:#3fca8f;box-shadow:0 0 6px #3fca8f}
.dot.home{background:rgba(255,255,255,0.7)}
.sess b{font-weight:500;color:var(--ivory);font-variant-numeric:tabular-nums}

.lang{
  background:var(--glass);border:0.5px solid var(--glass-line);color:var(--ivory);
  padding:8px 12px;border-radius:20px;font-size:13px;font-family:inherit;cursor:pointer;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.lang option{color:#101B33}

.hero{padding:40px 26px 12px;display:flex;justify-content:center}
.ai-panel{
  width:100%;max-width:640px;border-radius:26px;padding:30px 30px 26px;
  background:rgba(255,255,255,0.09);border:0.5px solid var(--glass-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.22);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);text-align:center;
}
.ai-title{font-family:'Marcellus',serif;font-size:30px;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:12px}
.ai-sub{font-size:14.5px;color:rgba(255,255,255,0.82);margin-top:8px}
.ai-input-row{display:flex;gap:10px;margin-top:22px}
.ai-input{
  flex:1;background:rgba(255,255,255,0.10);border:0.5px solid var(--glass-line);
  color:var(--ivory);padding:14px 18px;border-radius:16px;font-size:15px;font-family:inherit;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.ai-input::placeholder{color:rgba(255,255,255,0.55)}
.ai-input:focus{outline:none;border-color:rgba(255,255,255,0.55)}
.ai-send{
  width:52px;border:0.5px solid var(--glass-line);border-radius:16px;cursor:pointer;
  background:rgba(255,255,255,0.16);color:var(--ivory);font-size:20px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .2s;
}
.ai-send:hover{background:rgba(255,255,255,0.26)}

.grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:26px 22px;max-width:560px;margin:36px auto 54px;padding:0 26px;
}
.tile{display:flex;flex-direction:column;align-items:center;gap:11px;animation:rise .5s ease both}
.glass{
  width:100%;max-width:118px;aspect-ratio:1;border-radius:28px;
  background:var(--glass);border:0.5px solid var(--glass-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.24);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s ease, background .18s ease;
}
.glass svg{width:60%;height:60%}
.tile:hover .glass,.tile:focus-visible .glass{transform:translateY(-4px);background:rgba(255,255,255,0.18)}
.tile:focus-visible{outline:none}
.tile:focus-visible .glass{outline:2px solid rgba(255,255,255,0.6);outline-offset:3px}
.tile-label{font-size:13.5px;color:rgba(255,255,255,0.88);text-align:center}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tile{animation:none}}

footer{text-align:center;padding:28px;font-size:12px;color:rgba(255,255,255,0.4)}

/* ===== AI chat oynasi ===== */
.ai-overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(11,20,40,0.55)}
.ai-overlay.open{display:flex}
.ai-chat{width:100%;max-width:720px;height:min(82vh,700px);display:flex;flex-direction:column;border-radius:26px;overflow:hidden;
  background:rgba(255,255,255,0.09);border:0.5px solid var(--glass-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.22);
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.ai-chat-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:0.5px solid rgba(255,255,255,0.12)}
.ai-chat-title{display:flex;align-items:center;gap:10px;font-family:'Marcellus',serif;font-size:20px}
.ai-close{background:none;border:none;color:var(--ivory);font-size:26px;line-height:1;cursor:pointer;opacity:.8}
.ai-close:hover{opacity:1}
.ai-messages{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:18px;font-size:14.5px;line-height:1.5;border:0.5px solid rgba(255,255,255,0.16)}
.msg.user{align-self:flex-end;background:rgba(255,255,255,0.16)}
.msg.ai{align-self:flex-start;background:rgba(255,255,255,0.07)}
.msg .att{display:block;font-size:12px;color:rgba(255,255,255,0.7);margin-top:4px}
.ai-attach{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 6px}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,0.12);border:0.5px solid var(--glass-line)}
.chip b{font-weight:500}
.ai-chat-input{display:flex;align-items:center;gap:8px;padding:14px 16px;border-top:0.5px solid rgba(255,255,255,0.12)}
.icon-btn{width:42px;height:42px;flex:none;border:0.5px solid var(--glass-line);border-radius:14px;background:rgba(255,255,255,0.10);color:var(--ivory);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.icon-btn:hover{background:rgba(255,255,255,0.2)}
.ai-chat-text{flex:1;background:rgba(255,255,255,0.10);border:0.5px solid var(--glass-line);color:var(--ivory);padding:12px 16px;border-radius:16px;font-size:15px;font-family:inherit}
.ai-chat-text::placeholder{color:rgba(255,255,255,0.5)}
.ai-chat-text:focus{outline:none;border-color:rgba(255,255,255,0.55)}
.ai-chat-send{width:46px;height:42px;flex:none;border:0.5px solid var(--glass-line);border-radius:14px;background:rgba(255,255,255,0.18);color:var(--ivory);font-size:19px;cursor:pointer}
.ai-chat-send:hover{background:rgba(255,255,255,0.28)}
@media (max-width:560px){.ai-chat{height:88vh;max-width:none}.msg{max-width:88%}.icon-btn{width:38px;height:38px}}

/* ===== Telefon versiyasi ===== */
@media (max-width:560px){
  .topbar{padding:14px 16px;gap:10px;justify-content:center}
  .top-right{width:100%;justify-content:space-between;gap:10px}
  .sessions{gap:10px;font-size:11px;order:2;width:100%;justify-content:space-between}
  .brand-name{font-size:21px}
  .hero{padding:26px 16px 8px}
  .ai-panel{padding:24px 20px 22px}
  .ai-title{font-size:25px}
  .grid{gap:20px 14px;max-width:420px;padding:0 18px}
  .glass{max-width:none;border-radius:24px}
  .glass svg{width:56%;height:56%}
  .tile-label{font-size:12.5px}
}
@media (min-width:900px){
  .grid{max-width:640px;gap:30px 26px}
  .glass{max-width:132px;border-radius:32px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
      <polygon points="20,4 36,20 20,36 4,20" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="0.8"/>
      <polygon points="9,9 31,9 31,31 9,31" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="0.8"/>
    </svg>
    <span class="brand-name">Altin Turon</span>
  </div>
  <div class="top-right">
    <div class="sessions" id="sessions"></div>
    <select class="lang" id="lang" aria-label="Til">
      <option value="uz">O'zbek</option>
      <option value="tr">Türkçe</option>
      <option value="kk">Qazaqşa</option>
      <option value="tg">Tojik</option>
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
  </div>
</div>

<header class="hero">
  <div class="ai-panel">
    <div class="ai-title">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3z"/>
        <circle cx="18.5" cy="17.5" r="2"/>
      </svg>
      <span id="aiTitle">AI yordamchi</span>
    </div>
    <p class="ai-sub" id="aiSub">Moliya, aksiya va islom moliyasi bo'yicha so'rang</p>
    <div class="ai-input-row">
      <input class="ai-input" id="aiInput" placeholder="Savolingizni yozing...">
      <button class="ai-send" id="aiSend" aria-label="Yuborish">&rarr;</button>
    </div>
  </div>
</header>

<main class="grid" id="grid"></main>

<footer>Altin Turon &middot; halal fintech</footer>

<div class="ai-overlay" id="aiOverlay" aria-hidden="true">
  <div class="ai-chat">
    <div class="ai-chat-head">
      <div class="ai-chat-title">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8L12 3z"/><circle cx="18.5" cy="17.5" r="2"/></svg>
        <span id="aiChatTitle">AI yordamchi</span>
      </div>
      <button class="ai-close" id="aiClose" aria-label="Yopish">&times;</button>
    </div>
    <div class="ai-messages" id="aiMessages"></div>
    <div class="ai-attach" id="aiAttach"></div>
    <div class="ai-chat-input">
      <input type="file" id="fileImage" accept="image/*" hidden>
      <input type="file" id="fileDoc" hidden>
      <input type="file" id="fileAudio" accept="audio/*" hidden>
      <button class="icon-btn" id="btnImage" aria-label="Rasm yuklash" title="Rasm">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-8 8"/></svg>
      </button>
      <button class="icon-btn" id="btnFile" aria-label="Fayl yuklash" title="Fayl">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
      </button>
      <button class="icon-btn" id="btnAudio" aria-label="Audio yuklash" title="Audio">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      </button>
      <input class="ai-chat-text" id="aiChatText" placeholder="Xabar yozing...">
      <button class="ai-chat-send" id="aiChatSend" aria-label="Yuborish">&rarr;</button>
    </div>
  </div>
</div>

<script>
const STAR = `<svg viewBox="0 0 60 60" aria-hidden="true">
  <polygon points="30,4 56,30 30,56 4,30" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="0.8"/>
  <polygon points="11.6,11.6 48.4,11.6 48.4,48.4 11.6,48.4" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="0.8"/>
  <polygon points="30,4 34.2,19.8 48.4,11.6 40.2,25.8 56,30 40.2,34.2 48.4,48.4 34.2,40.2 30,56 25.8,40.2 11.6,48.4 19.8,34.2 4,30 19.8,25.8 11.6,11.6 25.8,19.8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.92)" stroke-width="0.8"/>
  <polygon points="35,18 42,25 42,35 35,42 25,42 18,35 18,25 25,18" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="0.7"/>
  <circle cx="30" cy="30" r="5" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="0.7"/>
</svg>`;

const SECTIONS = ["payments","budget","community","signal","news","zakat","education","charity","about"];
const LINKS = {payments:"#",budget:"#",community:"#",signal:"Investing",news:"#",zakat:"#",education:"#",charity:"#",about:"#"};

const T = {
  uz:{aiTitle:"AI yordamchi",aiSub:"Moliya, aksiya va islom moliyasi bo'yicha so'rang",aiPh:"Savolingizni yozing...",
    payments:"To'lovlar",budget:"Kirim-chiqim",community:"Jamiyat",signal:"Investing",news:"Yangiliklar",zakat:"Zakat",education:"Ta'lim",charity:"Ehson",about:"Biz haqimizda",
    tash:"Toshkent",ny:"Nyu-York",lon:"London",tok:"Tokio"},
  tr:{aiTitle:"AI asistan",aiSub:"Finans, hisse ve İslami finans hakkında sorun",aiPh:"Sorunuzu yazın...",
    payments:"Ödemeler",budget:"Gelir-gider",community:"Topluluk",signal:"Investing",news:"Haberler",zakat:"Zekât",education:"Eğitim",charity:"Bağış",about:"Hakkımızda",
    tash:"Taşkent",ny:"New York",lon:"Londra",tok:"Tokyo"},
  kk:{aiTitle:"AI көмекші",aiSub:"Қаржы, акция және ислам қаржысы бойынша сұраңыз",aiPh:"Сұрағыңызды жазыңыз...",
    payments:"Төлемдер",budget:"Кіріс-шығыс",community:"Қоғам",signal:"Investing",news:"Жаңалықтар",zakat:"Зекет",education:"Білім",charity:"Қайырымдылық",about:"Біз туралы",
    tash:"Ташкент",ny:"Нью-Йорк",lon:"Лондон",tok:"Токио"},
  tg:{aiTitle:"Ёрдамчии AI",aiSub:"Оид ба молия, саҳмия ва молияи исломӣ пурсед",aiPh:"Саволатонро нависед...",
    payments:"Пардохтҳо",budget:"Даромад-хароҷот",community:"Ҷомеа",signal:"Investing",news:"Хабарҳо",zakat:"Закот",education:"Таълим",charity:"Эҳсон",about:"Дар бораи мо",
    tash:"Тошканд",ny:"Ню-Йорк",lon:"Лондон",tok:"Токио"},
  ru:{aiTitle:"AI помощник",aiSub:"Спросите о финансах, акциях и исламских финансах",aiPh:"Напишите ваш вопрос...",
    payments:"Платежи",budget:"Доходы-расходы",community:"Сообщество",signal:"Investing",news:"Новости",zakat:"Закят",education:"Обучение",charity:"Пожертвования",about:"О нас",
    tash:"Ташкент",ny:"Нью-Йорк",lon:"Лондон",tok:"Токио"},
  en:{aiTitle:"AI assistant",aiSub:"Ask about finance, stocks and Islamic finance",aiPh:"Type your question...",
    payments:"Payments",budget:"Budget",community:"Community",signal:"Investing",news:"News",zakat:"Zakat",education:"Education",charity:"Charity",about:"About",
    tash:"Tashkent",ny:"New York",lon:"London",tok:"Tokyo"}
};

let lang = "uz";

function buildGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  SECTIONS.forEach((key,i)=>{
    const a = document.createElement("a");
    a.className = "tile"; a.href = LINKS[key]; a.style.animationDelay = (i*45)+"ms";
    a.innerHTML = `<div class="glass">${STAR}</div><span class="tile-label" data-k="${key}">${T[lang][key]}</span>`;
    grid.appendChild(a);
  });
}

function applyLang(){
  const d = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("aiTitle").textContent = d.aiTitle;
  document.getElementById("aiSub").textContent = d.aiSub;
  document.getElementById("aiInput").placeholder = d.aiPh;
  document.querySelectorAll(".tile-label").forEach(el=>{el.textContent = d[el.dataset.k];});
  renderSessions();
}

function tzTime(tz){
  const p = new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false,weekday:"short"}).formatToParts(new Date());
  const o={}; p.forEach(x=>o[x.type]=x.value);
  return {hm:`${o.hour}:${o.minute}`, mins:(+o.hour)*60+(+o.minute), wd:o.weekday};
}
function isOpen(t,openM,closeM){
  const weekend=(t.wd==="Sat"||t.wd==="Sun");
  return !weekend && t.mins>=openM && t.mins<closeM;
}
function renderSessions(){
  const d=T[lang];
  const tash=tzTime("Asia/Tashkent");
  const ny=tzTime("America/New_York");
  const lon=tzTime("Europe/London");
  const tok=tzTime("Asia/Tokyo");
  const rows=[
    {name:d.tash,t:tash,cls:"home"},
    {name:d.ny,  t:ny,  cls:isOpen(ny,570,960)?"open":""},
    {name:d.lon, t:lon, cls:isOpen(lon,480,990)?"open":""},
    {name:d.tok, t:tok, cls:isOpen(tok,540,900)?"open":""}
  ];
  document.getElementById("sessions").innerHTML = rows.map(r=>
    `<span class="sess"><span class="dot ${r.cls}"></span>${r.name} <b>${r.t.hm}</b></span>`
  ).join("");
}

document.getElementById("lang").addEventListener("change",e=>{lang=e.target.value;applyLang();});
const overlay=document.getElementById("aiOverlay");
const messages=document.getElementById("aiMessages");
const attachBar=document.getElementById("aiAttach");
let pending=[]; // biriktirilgan fayllar

function openChat(first){
  overlay.classList.add("open");overlay.setAttribute("aria-hidden","false");
  if(messages.childElementCount===0){addMsg("Assalomu alaykum! Moliya, aksiya yoki islom moliyasi bo'yicha so'rang.","ai");}
  if(first){document.getElementById("aiChatText").value=first;sendChat();}
  else{document.getElementById("aiChatText").focus();}
}
function closeChat(){overlay.classList.remove("open");overlay.setAttribute("aria-hidden","true");}
function addMsg(text,who,atts){
  const d=document.createElement("div");d.className="msg "+who;
  d.textContent=text||"";
  if(atts&&atts.length){atts.forEach(a=>{const s=document.createElement("span");s.className="att";s.textContent="📎 "+a;d.appendChild(s);});}
  messages.appendChild(d);messages.scrollTop=messages.scrollHeight;
}
function renderAttach(){
  attachBar.innerHTML=pending.map((n,i)=>`<span class="chip"><b>${n}</b> <span data-i="${i}" style="cursor:pointer">&times;</span></span>`).join("");
  attachBar.querySelectorAll("span[data-i]").forEach(x=>x.onclick=()=>{pending.splice(+x.dataset.i,1);renderAttach();});
}
function sendChat(){
  const inp=document.getElementById("aiChatText");
  const v=inp.value.trim();
  if(!v&&pending.length===0)return;
  addMsg(v,"user",pending.slice());
  inp.value="";pending=[];renderAttach();
  setTimeout(()=>addMsg("AI hali ulanmagan — tez kunda javob beradi.","ai"),400);
}
function pick(id){document.getElementById(id).click();}
["fileImage","fileDoc","fileAudio"].forEach(id=>{
  document.getElementById(id).addEventListener("change",e=>{
    if(e.target.files[0]){pending.push(e.target.files[0].name);renderAttach();}
    e.target.value="";
  });
});
document.getElementById("btnImage").onclick=()=>pick("fileImage");
document.getElementById("btnFile").onclick=()=>pick("fileDoc");
document.getElementById("btnAudio").onclick=()=>pick("fileAudio");
document.getElementById("aiChatSend").onclick=sendChat;
document.getElementById("aiChatText").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat();});
document.getElementById("aiClose").onclick=closeChat;
overlay.addEventListener("click",e=>{if(e.target===overlay)closeChat();});

function askAI(){const v=document.getElementById("aiInput").value.trim();document.getElementById("aiInput").value="";openChat(v);}
document.getElementById("aiSend").addEventListener("click",askAI);
document.getElementById("aiInput").addEventListener("keydown",e=>{if(e.key==="Enter")askAI();});

buildGrid(); applyLang();
setInterval(renderSessions,30000);
</script>
</body>
</html>
