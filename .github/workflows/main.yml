name: Altin Signal Bot

on:
  schedule:
    # Toshkent (UTC+5) Dushanba 05:00 - Shanba 02:00, har soat.
    # UTC: Dushanba 00:00 dan Juma 21:00 gacha.
    - cron: '0 0-23 * * 1-4'    # Dush-Pay: butun kun (UTC)
    - cron: '0 0-21 * * 5'      # Juma: 00:00-21:00 UTC (= Shanba 02:00 Toshkent)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install yfinance pandas requests lxml matplotlib
      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python bot.py
