name: Altin Signal Bot

on:
  schedule:
    - cron: '17 0-23 * * 1-4'
    - cron: '17 0-21 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: Ishlash rejimi
        required: true
        default: validate
        type: choice
        options:
          - validate
          - scan

permissions:
  contents: read

concurrency:
  group: altin-signal-site
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: >-
          python -m pip install
          yfinance==1.7.0
          pandas==3.1.0
          requests==2.34.2
          lxml==6.1.3
          matplotlib==3.11.2

      - name: Check Python syntax
        run: python -m py_compile bot.py

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python bot.py "${{ github.event.inputs.mode || 'scan' }}"
