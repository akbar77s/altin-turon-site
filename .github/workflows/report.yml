name: Altin ulanish testi va haftalik hisobot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Ishlash rejimi
        required: true
        default: test
        type: choice
        options:
          - test
          - report

permissions:
  contents: read

concurrency:
  group: altin-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: >-
          python -m pip install
          yfinance==1.7.0
          pandas==3.1.0
          requests==2.34.2
          lxml==6.1.3
          matplotlib==3.11.2

      - name: Check required secrets
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: >-
          python -c "import os;
          names=('TG_TOKEN','TG_CHAT_ID','SUPABASE_URL','SUPABASE_KEY');
          missing=[name for name in names if not os.environ.get(name)];
          print('Secrets mavjud:', ', '.join(name for name in names if name not in missing));
          assert not missing, 'Yetishmayotgan secrets: ' + ', '.join(missing)"

      - name: Test Supabase and Telegram
        if: ${{ github.event.inputs.mode == 'test' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "import os, requests; key=os.environ['SUPABASE_KEY']; r=requests.get(os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/signals', headers={'apikey':key,'Authorization':'Bearer '+key}, params={'select':'id','limit':'1'}, timeout=20); print('Supabase HTTP:',r.status_code); r.raise_for_status()"
          python -c "import os, requests; r=requests.post('https://api.telegram.org/bot'+os.environ['TG_TOKEN']+'/sendMessage', data={'chat_id':os.environ['TG_CHAT_ID'],'text':'✅ Altin Turon: GitHub Actions → Supabase → Telegram ulanish testi muvaffaqiyatli.'}, timeout=20); print('Telegram HTTP:',r.status_code); print(r.text[:300] if not r.ok else 'Telegram OK'); r.raise_for_status(); assert r.json().get('ok'), r.text"

      - name: Weekly report
        if: ${{ github.event.inputs.mode == 'report' }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python bot.py report
