<script>
const SUPABASE_URL = "https://cewwbrozmspimmegbhds.supabase.co";
const SUPABASE_ANON = "sb_publishable_pAuy5WbKAKo-REkCuoxmfA_5Zy3uavd";
const STLBL = {open:"Ochiq", tp:"Foyda oldi", sl:"Stop", closed:"Yopilgan"};
const TV_SYMBOLS = {
  AAPL:"NASDAQ:AAPL", ADBE:"NASDAQ:ADBE", AMD:"NASDAQ:AMD", AVGO:"NASDAQ:AVGO", MSFT:"NASDAQ:MSFT", NFLX:"NASDAQ:NFLX", NVDA:"NASDAQ:NVDA", QCOM:"NASDAQ:QCOM", CRM:"NYSE:CRM", UBER:"NYSE:UBER",
  GME:"NYSE:GME", AMC:"NYSE:AMC", KOSS:"NASDAQ:KOSS", CLOV:"NASDAQ:CLOV", RIVN:"NASDAQ:RIVN", LCID:"NASDAQ:LCID", NKLA:"NASDAQ:NKLA", CHPT:"NYSE:CHPT", PLUG:"NASDAQ:PLUG", FCEL:"NASDAQ:FCEL", RUN:"NASDAQ:RUN", PLTR:"NASDAQ:PLTR", SOFI:"NASDAQ:SOFI", HOOD:"NASDAQ:HOOD", RBLX:"NYSE:RBLX", COIN:"NASDAQ:COIN", MARA:"NASDAQ:MARA", RIOT:"NASDAQ:RIOT", UPST:"NASDAQ:UPST", AFRM:"NASDAQ:AFRM", NVAX:"NASDAQ:NVAX", MRNA:"NASDAQ:MRNA", OCGN:"NASDAQ:OCGN", SAVA:"NASDAQ:SAVA", DKNG:"NASDAQ:DKNG", CVNA:"NYSE:CVNA", SPCE:"NYSE:SPCE", AI:"NYSE:AI",
  "003670.KS":"KRX:003670", "006400.KS":"KRX:006400", "035420.KS":"KRX:035420", "051910.KS":"KRX:051910", "068270.KS":"KRX:068270", "207940.KS":"KRX:207940",
  "0175.HK":"HKEX:175", "1810.HK":"HKEX:1810", "2015.HK":"HKEX:2015", "9618.HK":"HKEX:9618", "9868.HK":"HKEX:9868",
  "2308.TW":"TWSE:2308", "2379.TW":"TWSE:2379", "2454.TW":"TWSE:2454", "3008.TW":"TWSE:3008", "3711.TW":"TWSE:3711", "6669.TW":"TWSE:6669",
  "4063.T":"TSE:4063", "4519.T":"TSE:4519", "4568.T":"TSE:4568", "4661.T":"TSE:4661", "6098.T":"TSE:6098", "6146.T":"TSE:6146", "6273.T":"TSE:6273", "6367.T":"TSE:6367", "6503.T":"TSE:6503", "6762.T":"TSE:6762", "6857.T":"TSE:6857", "6954.T":"TSE:6954", "6981.T":"TSE:6981", "7011.T":"TSE:7011", "7269.T":"TSE:7269", "7741.T":"TSE:7741", "9843.T":"TSE:9843",
  "ALU.AX":"ASX:ALU", "PLS.AX":"ASX:PLS", "PME.AX":"ASX:PME", "WTC.AX":"ASX:WTC", "XRO.AX":"ASX:XRO",
  "BSE.NS":"NSE:BSE", "CDSL.NS":"NSE:CDSL", "COFORGE.NS":"NSE:COFORGE", "DIXON.NS":"NSE:DIXON", "LTTS.NS":"NSE:LTTS", "MPHASIS.NS":"NSE:MPHASIS", "PERSISTENT.NS":"NSE:PERSISTENT", "POLYCAB.NS":"NSE:POLYCAB", "TATAELXSI.NS":"NSE:TATAELXSI",
  "AIXA.DE":"XETR:AIXA", "BOSS.DE":"XETR:BOSS", "DUE.DE":"XETR:DUE", "EVK.DE":"XETR:EVK", "FRA.DE":"XETR:FRA", "GXI.DE":"XETR:GXI", "HFG.DE":"XETR:HFG", "KGX.DE":"XETR:KGX", "LHA.DE":"XETR:LHA", "NDA.DE":"XETR:NDA", "NEM.DE":"XETR:NEM", "PSM.DE":"XETR:PSM", "PUM.DE":"XETR:PUM", "RHM.DE":"XETR:RHM", "SDF.DE":"XETR:SDF", "SY1.DE":"XETR:SY1", "WCH.DE":"XETR:WCH", "ZAL.DE":"XETR:ZAL",
  "AKE.PA":"EURONEXT:AKE", "ALO.PA":"EURONEXT:ALO", "BEN.PA":"EURONEXT:BEN", "ERF.PA":"EURONEXT:ERF", "ML.PA":"EURONEXT:ML", "RCO.PA":"EURONEXT:RCO", "SESG.PA":"EURONEXT:SESG", "UBI.PA":"EURONEXT:UBI", "VLA.PA":"EURONEXT:VLA",
  "AMG.AS":"EURONEXT:AMG", "ARCAD.AS":"EURONEXT:ARCAD", "BESI.AS":"EURONEXT:BESI", "FUR.AS":"EURONEXT:FUR",
  "BMED.MI":"MIL:BMED", "IG.MI":"MIL:IG", "LDO.MI":"MIL:LDO", "PIRC.MI":"MIL:PIRC",
  "CIE.MC":"BME:CIE", "GEST.MC":"BME:GEST", "MAP.MC":"BME:MAP", "SCYR.MC":"BME:SCYR",
  "BAB.L":"LSE:BAB", "BME.L":"LSE:BME", "CNA.L":"LSE:CNA", "EZJ.L":"LSE:EZJ", "HWDN.L":"LSE:HWDN", "IMI.L":"LSE:IMI", "ITV.L":"LSE:ITV", "MRO.L":"LSE:MRO", "QQ.L":"LSE:QQ", "WEIR.L":"LSE:WEIR",
  "BARN.SW":"SIX:BARN", "GALE.SW":"SIX:GALE", "SOON.SW":"SIX:SOON", "TEMN.SW":"SIX:TEMN"
};
const SUFFIX_EXCHANGES = [[".KS","KRX:"],[".HK","HKEX:"],[".TW","TWSE:"],[".T","TSE:"],[".AX","ASX:"],[".NS","NSE:"],[".DE","XETR:"],[".PA","EURONEXT:"],[".AS","EURONEXT:"],[".MI","MIL:"],[".MC","BME:"],[".L","LSE:"],[".SW","SIX:"],[".BR","EURONEXT:"],[".LS","EURONEXT:"],[".CO","OMXCOP:"],[".OL","OSL:"],[".HE","OMXHEX:"]];
const TF_TO_TV_INTERVAL = {"30m":"30", "1h":"60", "4h":"240"};
let curTab = "open", allRows = [], visibleRows = [], selectedKey = "";
const filters = {market:"", tf:"", status:""};
function fmt(v){return (v==null||v==="") ? "-" : Number(v).toLocaleString("en-US",{maximumFractionDigits:2});}
function rowKey(r){return String(r.id || r.signal_no || "") + "_" + String(r.ticker || "") + "_" + String(r.signal_time || r.created_at || "");}
function timeAgo(ts){if(!ts)return "";const d=new Date(ts),diff=(Date.now()-d.getTime())/1000;if(diff<3600)return Math.max(1,Math.floor(diff/60))+" daqiqa";if(diff<86400)return Math.floor(diff/3600)+" soat";return Math.floor(diff/86400)+" kun";}
function tvSymbol(ticker){
  const raw=String(ticker||"").toUpperCase().trim();
  if(!raw) return "";
  if(raw.includes(":")) return raw;
  if(TV_SYMBOLS[raw]) return TV_SYMBOLS[raw];
  for(const [suffix,exchange] of SUFFIX_EXCHANGES){
    if(raw.endsWith(suffix)){
      let base=raw.slice(0,-suffix.length);
      if(suffix===".HK") base=String(Number(base));
      return exchange+base;
    }
  }
  if(/^[A-Z]{1,5}$/.test(raw)) return TV_SYMBOLS[raw] || "NASDAQ:"+raw;
  return "";
}
function chartUrl(symbol, interval){const p=new URLSearchParams({frameElementId:"altin_turon_tv_chart",symbol,interval,hidetoptoolbar:"0",hidesidetoolbar:"1",symboledit:"1",saveimage:"0",toolbarbg:"101B33",studies:"[]",theme:"dark",style:"1",timezone:"exchange",withdateranges:"1",hideideas:"1",locale:"en",enabled_features:"[]",disabled_features:"[]"});return "https://s.tradingview.com/widgetembed/?"+p.toString();}
function selectRow(key){
  const row=visibleRows.find(r=>rowKey(r)===key)||visibleRows[0];
  const tv=document.getElementById("cpTv");
  if(!row){selectedKey="";document.getElementById("cpTitle").textContent="Grafik";document.getElementById("cpSub").textContent="Chapdagi pozitsiyani tanlang";tv.innerHTML='<div class="placeholder">Signal tanlang.<br>Grafik shu yerda jonli ochiladi.</div>';return;}
  selectedKey=rowKey(row);const no=row.signal_no?"#"+String(row.signal_no).padStart(5,"0"):"";const tf=row.timeframe||"30m";const symbol=tvSymbol(row.ticker);
  document.getElementById("cpTitle").textContent=`${no} ${row.ticker||""} · ${tf}`.trim();
  document.getElementById("cpSub").textContent=`${STLBL[row.status]||row.status||"Ochiq"} · Entry ${fmt(row.entry)} · ${symbol||"symbol topilmadi"}`;
  tv.innerHTML=symbol?`<iframe title="TradingView chart" allowtransparency="true" scrolling="no" allowfullscreen src="${chartUrl(symbol,TF_TO_TV_INTERVAL[tf]||"30")}"></iframe>`:'<div class="placeholder">Bu ticker uchun TradingView symbol topilmadi.</div>';
  document.querySelectorAll(".row").forEach(el=>el.classList.toggle("active",el.dataset.key===selectedKey));
}
function renderStats(rows){document.getElementById("stOpen").textContent=rows.filter(r=>r.status==="open").length;document.getElementById("stTotal").textContent=rows.length;}
function baseRows(){let rows=allRows.slice();if(curTab==="open")rows=rows.filter(r=>r.status==="open");if(curTab==="history")rows=rows.filter(r=>r.status!=="open");if(filters.market)rows=rows.filter(r=>r.region===filters.market);if(filters.tf)rows=rows.filter(r=>r.timeframe===filters.tf);if(curTab==="history"&&filters.status)rows=rows.filter(r=>r.status===filters.status);return rows;}
function renderList(){
  const list=document.getElementById("positionList");visibleRows=baseRows();document.getElementById("listTitle").textContent=curTab==="open"?"Ochiq pozitsiyalar":"History";document.getElementById("listCount").textContent=visibleRows.length;document.getElementById("fStatus").style.display=curTab==="history"?"flex":"none";
  if(!visibleRows.length){list.innerHTML='<div class="empty">Bu bo‘limda signal yo‘q.<br>Filtrni o‘zgartiring yoki yangi signalni kuting.</div>';selectRow("");return;}
  list.innerHTML=visibleRows.map(r=>{const key=rowKey(r),no=r.signal_no?"#"+String(r.signal_no).padStart(5,"0"):"",status=STLBL[r.status]||r.status||"Ochiq",symbol=tvSymbol(r.ticker);return `<button class="row${key===selectedKey?" active":""}" data-key="${key}"><div class="rowTop"><span class="no">${no}</span><span class="ticker">${r.ticker||""}</span><span class="ago">${timeAgo(r.signal_time||r.created_at)}</span></div><div class="rowInfo"><span class="mini"><small>Entry</small><b>${fmt(r.entry)}</b></span><span class="mini"><small>TV symbol</small><b>${symbol||"topilmadi"}</b></span></div><span class="badge">${status}</span></button>`;}).join("");
  list.querySelectorAll(".row").forEach(btn=>btn.addEventListener("click",()=>selectRow(btn.dataset.key)));selectRow(visibleRows.some(r=>rowKey(r)===selectedKey)?selectedKey:rowKey(visibleRows[0]));
}
async function load(){try{const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);const weekAgo=new Date(Date.now()-7*86400000).toISOString();const {data}=await sb.from("signals").select("*").gte("created_at",weekAgo).order("created_at",{ascending:false}).limit(500);allRows=data||[];renderStats(allRows);renderList();}catch(e){document.getElementById("positionList").innerHTML='<div class="empty">Xato: '+(e.message||e)+'</div>';}}
function setTab(tab){curTab=tab;document.getElementById("tabOpen").classList.toggle("active",tab==="open");document.getElementById("tabHistory").classList.toggle("active",tab==="history");renderList();}
function setupFilterGroup(groupId,key){const group=document.getElementById(groupId);group.querySelectorAll(".fbtn").forEach(btn=>btn.addEventListener("click",()=>{group.querySelectorAll(".fbtn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");filters[key]=btn.dataset.v;renderList();}));}
document.getElementById("tabOpen").addEventListener("click",()=>setTab("open"));document.getElementById("tabHistory").addEventListener("click",()=>setTab("history"));document.getElementById("refresh").addEventListener("click",load);setupFilterGroup("fMarket","market");setupFilterGroup("fTf","tf");setupFilterGroup("fStatus","status");load();setInterval(load,60000);
</script>
