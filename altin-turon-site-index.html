<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altin Turon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#101B33;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#16A0A8;text-decoration:none}
button{font-family:inherit}
@keyframes atFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes atPulse{0%,100%{opacity:.55}50%{opacity:1}}
.tile:hover{background:rgba(255,255,255,0.17)!important;transform:translateY(-3px)}
.lang.active{background:rgba(255,255,255,0.18)!important;color:#EFE6D0!important}
.sendbtn:hover{background:rgba(22,160,168,0.5)!important}
.chip:hover{background:rgba(255,255,255,0.16)!important}
.msg{padding:12px 15px;border-radius:15px;font-size:14px;line-height:1.6;max-width:82%;white-space:pre-wrap;animation:atFade .3s ease both}
.msg.user{align-self:flex-end;background:rgba(22,160,168,0.26);border:0.5px solid rgba(255,255,255,0.24)}
.msg.ai{align-self:flex-start;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.16);color:rgba(239,230,208,.9)}
</style>
</head>
<body>
<div style="position:relative;min-height:100vh;background:#101B33;font-family:Manrope,system-ui,sans-serif;color:#EFE6D0;overflow:hidden">

<div style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(90vw 70vh at 12% -10%, #0E5C63 0%, rgba(14,92,99,0) 62%), radial-gradient(70vw 60vh at 105% 8%, #16223F 0%, rgba(22,34,63,0) 60%), radial-gradient(80vw 70vh at 50% 115%, #0C4A50 0%, rgba(12,74,80,0) 65%), linear-gradient(180deg,#101B33 0%,#0d1729 100%)"></div>
<svg style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.11" aria-hidden="true"><defs><pattern id="atGirih" width="96" height="96" patternUnits="userSpaceOnUse"><g fill="none" stroke="#EFE6D0" stroke-width="1"><rect x="24" y="24" width="48" height="48"></rect><rect x="24" y="24" width="48" height="48" transform="rotate(45 48 48)"></rect><circle cx="48" cy="48" r="10"></circle><path d="M0 48 L24 48 M72 48 L96 48 M48 0 L48 24 M48 72 L48 96"></path></g></pattern></defs><rect width="100%" height="100%" fill="url(#atGirih)"></rect></svg>
<div style="position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(16,27,51,.35) 0%,rgba(13,23,41,.72) 100%)"></div>

<div style="position:relative;max-width:1120px;margin:0 auto;padding:clamp(18px,3vw,34px) clamp(16px,3vw,32px) 64px">

  <header style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;margin-bottom:clamp(22px,4vw,40px)">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,0.10);border:0.5px solid rgba(255,255,255,0.28);box-shadow:inset 0 1px 0 rgba(255,255,255,0.24);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EFE6D0" stroke-width="1.4"><rect x="5.5" y="5.5" width="13" height="13"></rect><rect x="5.5" y="5.5" width="13" height="13" transform="rotate(45 12 12)"></rect></svg>
      </span>
      <span style="font-family:Marcellus,serif;font-size:clamp(17px,2.2vw,21px);letter-spacing:.06em">Altin Turon</span>

    <div id="clocks" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"></div>

    <div id="langs" style="display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.20);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)"></div>
  </header>

  <div style="animation:atFade .5s ease both">
    <div style="max-width:760px;margin:0 auto clamp(28px,5vw,52px);text-align:center">
      <p id="kicker" style="margin:0 0 10px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(239,230,208,.5)"></p>
      <h1 id="heroTitle" style="margin:0 0 22px;font-family:Marcellus,serif;font-weight:400;font-size:clamp(28px,5.2vw,46px);line-height:1.15;letter-spacing:.01em"></h1>

          <span id="aiTitle" style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(239,230,208,.7)"></span>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <input id="aiInput" placeholder="" style="flex:1;min-width:0;padding:14px 16px;border-radius:15px;border:0.5px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.07);color:#EFE6D0;font-family:Manrope,sans-serif;font-size:15px;outline:none">
          <button class="sendbtn" onclick="openChat()" style="flex:none;width:48px;height:48px;border-radius:15px;cursor:pointer;display:grid;place-items:center;background:rgba(22,160,168,0.32);border:0.5px solid rgba(255,255,255,0.32);box-shadow:inset 0 1px 0 rgba(255,255,255,0.28);color:#EFE6D0;transition:background .25s">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 12h15M13 6l6 6-6 6"></path></svg>
          </button>
        </div>
        <div id="chips" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px"></div>
      </div>
    </div>

    <div id="tiles" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(98px,26vw,190px),1fr));gap:clamp(10px,1.6vw,18px)"></div>
  </div>

  <footer style="margin-top:52px;padding-top:20px;border-top:0.5px solid rgba(255,255,255,0.14);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:11.5px;letter-spacing:.1em;color:rgba(239,230,208,.42)">
    <span>Altin Turon · halal fintech</span>
    <span>Samarqand · 2026</span>

</div>
</div>

<!-- AI CHAT OVERLAY -->
<div id="aiOverlay" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(10,16,30,0.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:16px">
  <div style="width:100%;max-width:560px;height:min(80vh,680px);display:flex;flex-direction:column;border-radius:24px;background:rgba(20,30,52,0.82);border:0.5px solid rgba(255,255,255,0.24);box-shadow:0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);overflow:hidden">
    <div style="display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:0.5px solid rgba(255,255,255,0.14)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8FD9DC" stroke-width="1.4"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"></path></svg>
      <span id="aiOverTitle" style="font-family:Marcellus,serif;font-size:17px;letter-spacing:.04em;flex:1">AI yordamchi</span>

    <div id="messages" style="flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px"></div>
    <div style="padding:14px 16px;border-top:0.5px solid rgba(255,255,255,0.14);display:flex;gap:10px">
      <input id="chatInput" placeholder="Xabar yozing..." onkeydown="if(event.key==='Enter')sendChat()" style="flex:1;min-width:0;padding:13px 15px;border-radius:14px;border:0.5px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.07);color:#EFE6D0;font-family:inherit;font-size:14px;outline:none">
      <button class="sendbtn" onclick="sendChat()" style="flex:none;width:46px;height:46px;border-radius:14px;cursor:pointer;display:grid;place-items:center;background:rgba(22,160,168,0.32);border:0.5px solid rgba(255,255,255,0.32);color:#EFE6D0;transition:background .25s">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 12h15M13 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>
</div>

<script>
const AI_URL = "https://cewwbrozmspimmegbhds.supabase.co/functions/v1/ai";

const DICT = {
  uz:{kicker:"Islom moliyasi · super-ilova",heroTitle:"Halol moliya — bir ilovada",aiTitle:"AI yordamchi",aiPh:"Moliya, aksiya va islom moliyasi bo'yicha so'rang",payments:"To'lovlar",budget:"Kirim-chiqim",community:"Jamiyat",investing:"Investing",news:"Yangiliklar",zakat:"Zakat",edu:"Ta'lim",charity:"Ehson",about:"Biz haqimizda",soon:"tez kunda",chips:["Zakat qanday hisoblanadi?","Murobaha nima?","Aksiya halolmi?"],hello:"Assalomu alaykum! Moliya, aksiya yoki islom moliyasi bo'yicha so'rang."},
  tr:{kicker:"İslami finans · süper uygulama",heroTitle:"Helal finans — tek uygulamada",aiTitle:"AI asistan",aiPh:"Finans, hisse ve İslami finans hakkında sorun",payments:"Ödemeler",budget:"Gelir-gider",community:"Topluluk",investing:"Yatırım",news:"Haberler",zakat:"Zekât",edu:"Eğitim",charity:"Bağış",about:"Hakkımızda",soon:"yakında",chips:["Zekât nasıl hesaplanır?","Murabaha nedir?","Hisse helal mi?"],hello:"Selamünaleyküm! Finans, hisse veya İslami finans hakkında sorun."},
  kk:{kicker:"Ислам қаржысы · супер-қосымша",heroTitle:"Адал қаржы — бір қосымшада",aiTitle:"AI көмекші",aiPh:"Қаржы, акция және ислам қаржысы туралы сұраңыз",payments:"Төлемдер",budget:"Кіріс-шығыс",community:"Қауымдастық",investing:"Инвестиция",news:"Жаңалықтар",zakat:"Зекет",edu:"Білім",charity:"Қайырымдылық",about:"Біз туралы",soon:"жақында",chips:["Зекет қалай есептеледі?","Мурабаха деген не?","Акция адал ма?"],hello:"Ассалаумағалейкум! Қаржы, акция немесе ислам қаржысы туралы сұраңыз."},
  tg:{kicker:"Молияи исломӣ · супер-барнома",heroTitle:"Молияи ҳалол — дар як барнома",aiTitle:"Ёрдамчии AI",aiPh:"Дар бораи молия, саҳмия ва молияи исломӣ пурсед",payments:"Пардохтҳо",budget:"Даромад-хароҷот",community:"Ҷомеа",investing:"Сармоягузорӣ",news:"Хабарҳо",zakat:"Закот",edu:"Таълим",charity:"Хайрия",about:"Дар бораи мо",soon:"ба зудӣ",chips:["Закот чӣ тавр ҳисоб мешавад?","Муробаҳа чист?","Саҳмия ҳалол аст?"],hello:"Ассалому алайкум! Дар бораи молия, саҳмия ё молияи исломӣ пурсед."},
  ru:{kicker:"Исламские финансы · супер-приложение",heroTitle:"Халяльные финансы — в одном приложении",aiTitle:"AI-помощник",aiPh:"Спросите о финансах, акциях и исламских финансах",payments:"Платежи",budget:"Доходы-расходы",community:"Сообщество",investing:"Инвестиции",news:"Новости",zakat:"Закят",edu:"Обучение",charity:"Пожертвования",about:"О нас",soon:"скоро",chips:["Как считается закят?","Что такое мурабаха?","Халяльна ли акция?"],hello:"Ассаляму алейкум! Спросите о финансах, акциях или исламских финансах."},
  en:{kicker:"Islamic finance · super app",heroTitle:"Halal finance — in one app",aiTitle:"AI assistant",aiPh:"Ask about finance, stocks and Islamic finance",payments:"Payments",budget:"Budget",community:"Community",investing:"Investing",news:"News",zakat:"Zakat",edu:"Education",charity:"Charity",about:"About us",soon:"coming soon",chips:["How is zakat calculated?","What is murabaha?","Is this stock halal?"],hello:"Assalomu alaykum! Ask about finance, stocks or Islamic finance."}
};

const CITIES = [["Toshkent","Asia/Tashkent","#16A0A8"],["Nyu-York","America/New_York","#8FD9DC"],["London","Europe/London","#16A0A8"],["Tokio","Asia/Tokyo","#4E7F98"]];
const LANGS = ["uz","tr","kk","tg","ru","en"];

// SVG ikonlar (yangi dizayndan)
const ICONS = {
  payments:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EFE6D0" stroke-width="1.4"><rect x="2.5" y="5.5" width="19" height="13" rx="3"></rect><path d="M2.5 10h19M6 14.5h4"></path></svg>',
  budget:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EFE6D0" stroke-width="1.4"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"></path></svg>',
  community:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EFE6D0" stroke-width="1.4"><circle cx="8" cy="9" r="3"></circle><circle cx="16" cy="9" r="3"></circle><path d="M3 19c0-3 2.2-4.5 5-4.5M21 19c0-3-2.2-4.5-5-4.5M9 19h6"></path></svg>',
  investing:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EFE6D0" stroke-width="1.4"><path d="M3 17l5.5-6 4 3.5L21 6"></path><path d="M15.5 6H21v5.5"></path></svg>',
  news:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EFE6D0" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M6.5 9.5h7M6.5 13h11M6.5 16h8"></path></svg>',
  zakat:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EFE6D0" stroke-width="1.4"><rect x="6" y="6" width="12" height="12"></rect><rect x="6" y="6" width="12" height="12" transform="rotate(45 12 12)"></rect></svg>',
  edu:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EFE6D0" stroke-width="1.4"><path d="M12 7c-2-1.6-4.2-2-7-2v12c2.8 0 5 .4 7 2 2-1.6 4.2-2 7-2V5c-2.8 0-5 .4-7 2z"></path><path d="M12 7v12"></path></svg>',
  charity:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EFE6D0" stroke-width="1.4"><path d="M12 20s-7-4.4-7-9a3.6 3.6 0 017-1.2A3.6 3.6 0 0119 11c0 4.6-7 9-7 9z"></path></svg>',
  about:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EFE6D0" stroke-width="1.4"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.6v.6"></path></svg>'
};
// tartib: To'lovlar, Kirim-chiqim, Jamiyat, Investing, Yangiliklar, Zakat, Ta'lim, Ehson, Biz haqimizda
const TILE_ORDER = [
  {key:"payments",icon:"payments",link:null},
  {key:"budget",icon:"budget",link:null},
  {key:"community",icon:"community",link:null},
  {key:"investing",icon:"investing",link:"signal.html"},
  {key:"news",icon:"news",link:null},
  {key:"zakat",icon:"zakat",link:null},
  {key:"edu",icon:"edu",link:null},
  {key:"charity",icon:"charity",link:null},
  {key:"about",icon:"about",link:null}
];

let curLang = "uz";
let aiHistory = [];

function T(){ return DICT[curLang] || DICT.uz; }

function renderClocks(){
  const now = new Date();
  document.getElementById("clocks").innerHTML = CITIES.map(([city,tz,dot])=>{
    const time = new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:tz}).format(now);
    return `<div style="display:flex;flex-direction:column;gap:2px;padding:7px 11px;border-radius:12px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.20);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)">
      <span style="display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(239,230,208,.55)"><i style="width:5px;height:5px;border-radius:50%;background:${dot};animation:atPulse 2.4s infinite"></i>${city}</span>
      <span style="font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.04em">${time}</span></div>`;
  }).join("");
}

function renderLangs(){
  document.getElementById("langs").innerHTML = LANGS.map(code=>
    `<button class="lang ${code===curLang?'active':''}" onclick="setLang('${code}')" style="padding:6px 10px;border-radius:10px;cursor:pointer;font-size:11.5px;letter-spacing:.08em;border:none;transition:background .25s;color:${code===curLang?'#EFE6D0':'rgba(239,230,208,.55)'};background:${code===curLang?'rgba(255,255,255,0.18)':'transparent'}">${code.toUpperCase()}</button>`
  ).join("");
}

function renderTiles(){
  const t = T();
  document.getElementById("tiles").innerHTML = TILE_ORDER.map(tile=>{
    const label = t[tile.key];
    const onclick = tile.link ? `location.href='${tile.link}'` : `alert('${t.soon}')`;
    return `<button class="tile" onclick="${onclick}" style="display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:clamp(14px,2vw,20px);cursor:pointer;text-align:left;border-radius:20px;background:rgba(255,255,255,0.10);border:0.5px solid rgba(255,255,255,0.28);box-shadow:inset 0 1px 0 rgba(255,255,255,0.24), 0 8px 30px rgba(0,0,0,.24);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#EFE6D0;transition:background .28s, transform .28s">
      <span style="display:grid;place-items:center;width:clamp(40px,5vw,52px);height:clamp(40px,5vw,52px);border-radius:16px;background:rgba(255,255,255,0.10);border:0.5px solid rgba(255,255,255,0.26);box-shadow:inset 0 1px 0 rgba(255,255,255,0.24)">${ICONS[tile.icon]}</span>
      <span style="font-size:clamp(12px,1.4vw,14.5px);letter-spacing:.02em">${label}</span></button>`;
  }).join("");
}

function renderChips(){
  const t = T();
  document.getElementById("chips").innerHTML = t.chips.map(c=>
    `<button class="chip" onclick="openChat(this.textContent)" style="padding:8px 13px;border-radius:11px;cursor:pointer;font-size:12.5px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.20);color:rgba(239,230,208,.8);transition:background .25s">${c}</button>`
  ).join("");
}

function applyLang(){
  const t = T();
  document.getElementById("kicker").textContent = t.kicker;
  document.getElementById("heroTitle").textContent = t.heroTitle;
  document.getElementById("aiTitle").textContent = t.aiTitle;
  document.getElementById("aiOverTitle").textContent = t.aiTitle;
  document.getElementById("aiInput").placeholder = t.aiPh;
  document.documentElement.lang = curLang;
  renderLangs(); renderTiles(); renderChips();
}
function setLang(code){ curLang = code; applyLang(); }

// AI CHAT
const overlay = document.getElementById("aiOverlay");
const messages = document.getElementById("messages");

function addMsg(text, who){
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  messages.appendChild(d);
  messages.scrollTop = messages.scrollHeight;
  return d;
}

function openChat(first){
  overlay.style.display = "flex";
  if(messages.childElementCount === 0){ addMsg(T().hello, "ai"); }
  const q = (typeof first === "string" && first) ? first : document.getElementById("aiInput").value.trim();
  document.getElementById("aiInput").value = "";
  if(q){ document.getElementById("chatInput").value = q; sendChat(); }
  else { document.getElementById("chatInput").focus(); }
}
function closeChat(){ overlay.style.display = "none"; }

async function sendChat(){
  const inp = document.getElementById("chatInput");
  const v = inp.value.trim();
  if(!v) return;
  addMsg(v, "user");
  inp.value = "";
  const typing = addMsg("...", "ai");
  try{
    const res = await fetch(AI_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:v, history:aiHistory})
    });
    const data = await res.json();
    typing.remove();
    let reply = data.reply;
    if(!reply){ reply = "Xato: " + (data.error||"noma'lum") + (data.detail?" — "+data.detail:""); }
    addMsg(reply, "ai");
    aiHistory.push({role:"user",content:v});
    aiHistory.push({role:"assistant",content:reply});
    if(aiHistory.length>60) aiHistory = aiHistory.slice(-60);
  }catch(e){
    typing.remove();
    addMsg("Ulanishda xato. Keyinroq urinib ko'ring.", "ai");
  }
}

// init
renderClocks();
setInterval(renderClocks, 1000);
applyLang();
